# لبه پنل مانیتورینگ پاسارگاد میزبان
#
# دو نکته که قبلاً وقت گرفته‌اند و اینجا رعایت شده‌اند:
#
# ۱. انجین‌ایکس نام کانتینر را فقط یک بار هنگام شروع حل می‌کند. اگر سرویس web
#    بازسازی شود آی‌پی کانتینر عوض می‌شود و انجین‌ایکس تا ری‌استارت ۵۰۲ می‌دهد.
#    راه‌حل: resolver داخلی داکر به‌علاوه متغیر در proxy_pass.
#
# ۲. با proxy_pass متغیردار، انجین‌ایکس دیگر خودش کوئری‌استرینگ را منتقل
#    نمی‌کند. هرجا متغیر هست، $is_args$args باید صریح نوشته شود.

resolver 127.0.0.11 valid=10s ipv6=off;

map $host $upstream_web {
  default web:3000;
}

# ── HTTP: فقط تمدید گواهی و هدایت به HTTPS ───────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # پنل مدیریتی است؛ نباید ایندکس شود
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  absolute_redirect off;
  port_in_redirect off;

  client_max_body_size 4m;

  # ایجنت‌ها هر ۱۰ ثانیه گزارش می‌دهند. با ده‌ها سرور این پرمصرف‌ترین مسیر است.
  location = /api/ingest {
    proxy_pass http://$upstream_web/api/ingest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    20s;
    access_log off;
  }

  location / {
    proxy_pass http://$upstream_web$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
  }
}
