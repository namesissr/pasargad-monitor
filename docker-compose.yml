services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pasargad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pasargad_monitor}
      TZ: ${REPORT_TZ:-Asia/Tehran}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # مهاجرت‌ها فقط روی دیتابیس خالی و بار اول خودکار اجرا می‌شوند.
      # مهاجرت بعدی را دستی بزنید.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # فقط روی لوپ‌بک. پستگرس هرگز نباید از اینترنت در دسترس باشد.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pasargad} -d ${POSTGRES_DB:-pasargad_monitor}']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pasargad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pasargad_monitor}
      SESSION_SECRET: ${SESSION_SECRET}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      REPORT_TZ: ${REPORT_TZ:-Asia/Tehran}
      AGENT_INTERVAL_SEC: ${AGENT_INTERVAL_SEC:-10}
      TZ: ${REPORT_TZ:-Asia/Tehran}
    expose:
      - '3000'
    volumes:
      # ایجنت و اسکریپت نصبش از روی دیسک سرو می‌شوند نه از داخل ایمیج.
      # این‌ها بیشتر از خود پنل تغییر می‌کنند (هر سیستم‌عامل تازه‌ای که
      # پشتیبانی می‌شود یک ویرایش است)، و بدون این مانت، هر تغییر کوچک
      # نیازمند بیلد کامل نکست بود.
      - ./public/agent:/app/public/agent:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pasargad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pasargad_monitor}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      REPORT_TZ: ${REPORT_TZ:-Asia/Tehran}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      TZ: ${REPORT_TZ:-Asia/Tehran}

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/acme:/var/www/acme
    environment:
      TZ: ${REPORT_TZ:-Asia/Tehran}

volumes:
  pgdata:
